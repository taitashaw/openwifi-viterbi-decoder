<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- Zynq PS container -->
  <rect x="20" y="40" width="160" height="200" rx="10" fill="#eef3fb" stroke="#30578f" stroke-width="2"/>
  <text x="100" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Zynq UltraScale+ PS</text>
  <text x="100" y="135" text-anchor="middle" font-size="14" fill="#30578f">ARM Cortex-A53</text>
  <text x="100" y="155" text-anchor="middle" font-size="12" fill="#555">(ZCU104)</text>

  <!-- AXI DMA -->
  <rect x="230" y="60" width="170" height="160" rx="10" fill="#fdf3e3" stroke="#a66a00" stroke-width="2"/>
  <text x="315" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">AXI DMA</text>
  <text x="315" y="105" text-anchor="middle" font-size="12" fill="#a66a00">MM2S</text>
  <text x="315" y="125" text-anchor="middle" font-size="11" fill="#555">(mem &#8594; stream)</text>
  <text x="315" y="160" text-anchor="middle" font-size="12" fill="#a66a00">S2MM</text>
  <text x="315" y="180" text-anchor="middle" font-size="11" fill="#555">(stream &#8594; mem)</text>

  <!-- PS <-> DMA arrows -->
  <path d="M180 100 L230 100" stroke="#30578f" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M230 170 L180 170" stroke="#30578f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PL region dashed box -->
  <rect x="450" y="20" width="700" height="520" rx="12" fill="#fbfbfb" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="800" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">Programmable Logic &#8212; viterbi_k7_axis (your custom IP)</text>

  <!-- Input adapter -->
  <rect x="480" y="200" width="190" height="140" rx="10" fill="#e9f7ef" stroke="#1e7d44" stroke-width="2"/>
  <text x="575" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">AXI-Stream In</text>
  <text x="575" y="225" text-anchor="middle" font-size="11" fill="#555">viterbi_axis_in</text>
  <text x="575" y="250" text-anchor="middle" font-size="11" fill="#1e7d44">tdata[7:0] &#8594;</text>
  <text x="575" y="270" text-anchor="middle" font-size="11" fill="#1e7d44">sym0[2:0], sym1[2:0]</text>
  <text x="575" y="288" text-anchor="middle" font-size="11" fill="#1e7d44">erase[1:0]</text>
  <text x="575" y="306" text-anchor="middle" font-size="11" fill="#1e7d44">frame_start/frame_end</text>
  <text x="575" y="324" text-anchor="middle" font-size="10" fill="#777">(input_valid gated by</text>
  <text x="575" y="337" text-anchor="middle" font-size="10" fill="#777">input_accept, not passthrough)</text>

  <!-- Decoder core -->
  <rect x="730" y="150" width="210" height="240" rx="10" fill="#eef0fb" stroke="#3b3b9e" stroke-width="2"/>
  <text x="835" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Viterbi K=7 Core</text>
  <text x="835" y="175" text-anchor="middle" font-size="11" fill="#555">viterbi_k7_decoder</text>
  <rect x="750" y="190" width="170" height="40" rx="6" fill="#dfe2f7" stroke="#3b3b9e"/>
  <text x="835" y="214" text-anchor="middle" font-size="11" fill="#1a1a1a">RECEIVE: ACS, 64-state</text>
  <rect x="750" y="240" width="170" height="40" rx="6" fill="#dfe2f7" stroke="#3b3b9e"/>
  <text x="835" y="264" text-anchor="middle" font-size="11" fill="#1a1a1a">tree-reduced best-state</text>
  <rect x="750" y="290" width="170" height="40" rx="6" fill="#dfe2f7" stroke="#3b3b9e"/>
  <text x="835" y="314" text-anchor="middle" font-size="11" fill="#1a1a1a">TRACEBACK: BRAM survivor</text>
  <text x="835" y="350" text-anchor="middle" font-size="10" fill="#777">decoded_bits, decode_len,</text>
  <text x="835" y="363" text-anchor="middle" font-size="10" fill="#777">decode_done, busy</text>

  <!-- Output adapter -->
  <rect x="1000" y="200" width="130" height="140" rx="10" fill="#e9f7ef" stroke="#1e7d44" stroke-width="2"/>
  <text x="1065" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">AXI-Stream Out</text>
  <text x="1065" y="225" text-anchor="middle" font-size="11" fill="#555">viterbi_axis_out</text>
  <text x="1065" y="250" text-anchor="middle" font-size="11" fill="#1e7d44">&#8594; tdata[7:0]</text>
  <text x="1065" y="270" text-anchor="middle" font-size="10" fill="#777">bytes, LSB-first,</text>
  <text x="1065" y="285" text-anchor="middle" font-size="10" fill="#777">tlast on final byte</text>

  <!-- Arrows: DMA -> PL -> DMA (all straight, right-angle routing) -->
  <path d="M400 100 L440 100 L440 270 L480 270" stroke="#1e7d44" stroke-width="2.5" fill="none" marker-end="url(#arrowg)"/>
  <text x="447" y="190" font-size="10" fill="#1e7d44">S_AXIS</text>

  <path d="M670 270 L730 270" stroke="#3b3b9e" stroke-width="2.5" marker-end="url(#arrowb)"/>
  <path d="M940 270 L1000 270" stroke="#3b3b9e" stroke-width="2.5" marker-end="url(#arrowb)"/>

  <path d="M1065 340 L1065 505 L315 505 L315 220" stroke="#1e7d44" stroke-width="2.5" fill="none" marker-end="url(#arrowg)"/>
  <text x="690" y="498" text-anchor="middle" font-size="10" fill="#1e7d44">M_AXIS &#8594; DMA S2MM &#8594; PS memory</text>

  <!-- gating note -->
  <text x="835" y="405" text-anchor="middle" font-size="10" fill="#777">input_accept_gated = input_accept AND NOT streaming_busy</text>
  <text x="835" y="421" text-anchor="middle" font-size="10" fill="#777">(blocks a new frame until the previous output has fully drained)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#30578f"/></marker>
    <marker id="arrowg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1e7d44"/></marker>
    <marker id="arrowb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b3b9e"/></marker>
  </defs>
</svg>
